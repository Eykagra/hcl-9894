services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: jwtdemo
      MYSQL_USER: jwtdemo
      MYSQL_PASSWORD: ${JWTDEMO_DB_PASSWORD:?Set JWTDEMO_DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${JWTDEMO_DB_ROOT_PASSWORD:?Set JWTDEMO_DB_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:${JWTDEMO_MYSQL_PORT:-3307}:3306"
    volumes:
      - jwt_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql -h 127.0.0.1 -u \"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 4s
      retries: 15
      start_period: 20s

  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/jwtdemo
      SPRING_DATASOURCE_USERNAME: jwtdemo
      SPRING_DATASOURCE_PASSWORD: ${JWTDEMO_DB_PASSWORD:?Set JWTDEMO_DB_PASSWORD in .env}
      APP_JWT_SECRET: ${JWTDEMO_JWT_SECRET:?Set JWTDEMO_JWT_SECRET in .env}
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${JWTDEMO_HTTP_PORT:-8088}:80"
    depends_on:
      - backend

volumes:
  jwt_mysql_data:
